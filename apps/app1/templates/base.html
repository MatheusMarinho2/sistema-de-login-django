<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <style>
        /* CSS básico para layout */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        header { background: #35424a; color: #ffffff; padding: 1rem 0; text-align: center; }
        nav a { color: #ffffff; margin: 0 1rem; text-decoration: none; }
        .container { width: 90%; max-width: 800px; margin: 2rem auto; background: #ffffff; padding: 2rem; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        a.button { display: inline-block; padding: 0.5rem 1rem; background: #35424a; color: #ffffff; text-decoration: none; border-radius: 4px; }
        a.button:hover { background: #1f2a30; }
        form input, form select, form textarea { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border: 1px solid #ccc; border-radius: 4px; }
        form button { padding: 0.5rem 1rem; border: none; background: #35424a; color: #fff; border-radius: 4px; cursor: pointer; }
        form button:hover { background: #1f2a30; }
        ul { list-style: none; padding: 0; }
        ul li { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <header>
        <h1>HI SERVICE</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            {% if user.is_authenticated %}
                <a href="{% url 'task_list' %}">Minhas Tarefas</a>
                <a href="{% url 'password_change' %}">Trocar Senha</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:#ffffff; cursor:pointer;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
