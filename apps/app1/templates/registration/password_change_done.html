{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Senha Alterada" %}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card shadow-lg mx-auto text-center" style="max-width: 500px;">
    <div class="card-header bg-success text-white">
      <h2 class="card-title mb-0">
        <i class="fas fa-check-circle me-2"></i>
        {% trans "Senha Alterada!" %}
      </h2>
    </div>

    <div class="card-body">
      <div class="mb-4">
        <i class="fas fa-shield-alt fa-5x text-success mb-3"></i>
        <p class="lead">
          {% trans "Sua senha foi alterada com sucesso." %}
        </p>
      </div>

      <div class="d-grid">
        <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
          <i class="fas fa-home me-2"></i>
          {% trans "Voltar para a página inicial" %}
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
