{% extends 'base.html' %}
{% block title %}{{ view.action_title|default:"Formulário de Tarefa" }}{% endblock %}
{% block content %}
  <h1>{{ view.action_title|default:"Formulário de Tarefa" }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
      <button type="submit">Salvar</button>
      <a href="{% url 'task_list' %}" class="button">Cancelar</a>
    </div>
  </form>
{% endblock %}
